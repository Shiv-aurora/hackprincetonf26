[project]
name = "mayajaal"
version = "0.1.0"
description = "MayaJaal backend: gateway, real tier, shadow tier, event hub"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "faker>=30",
  "websockets>=13",
  "mcp>=1.2",
  "cryptography>=50",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mayajaal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
